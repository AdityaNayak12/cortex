<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cortex Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header>
        <h1>🧠 Cortex Dashboard</h1>
        <p>Your AI-powered study analytics</p>
    </header>

    <main>
        <section id="user-id-section">
            <label for="user-id-input">User ID:</label>
            <input type="number" id="user-id-input" placeholder="Enter your ID" min="1" />
            <button id="btn-save-id">Save</button>
            <span id="id-status" class="id-status"></span>
        </section>

        <section id="insights-section">
            <h2>Learning Insights</h2>
            <button id="btn-load-insights">Load Insights</button>
            <pre id="insights-output">Click "Load Insights" to analyse your sessions.</pre>
        </section>

        <section id="plan-section">
            <h2>Today's Study Plan</h2>
            <button id="btn-load-plan">Generate Plan</button>
            <pre id="plan-output">Click "Generate Plan" to get your personalised schedule.</pre>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
